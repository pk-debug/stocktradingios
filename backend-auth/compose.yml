# Local identity-gateway hosting. A public deployment also needs HTTPS termination.
services:
  paper-api:
    build:
      context: ..
      dockerfile: backend-auth/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - northstar-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  northstar-data:
